<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creando registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
         :root {
            --bs-primary: #0b6e8a;
            --bs-primary-rgb: 11, 110, 138;
            --soft: #eaf4f7;
        }
        
        body {
            background: #f4f7f9;
            padding-bottom: 6rem;
        }
        
        .app {
            max-width: 520px;
            margin: 0 auto;
        }
        
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #fff;
            border-bottom: 1px solid #dde4e8;
        }
        
        .section-card {
            border: 0;
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-weight: 600;
        }
        
        .section-title .bi {
            color: var(--bs-primary);
        }
        
        .form-box {
            background: var(--soft);
            border-radius: 10px;
            padding: 1rem;
        }
        
        .item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: .5rem;
            padding: .6rem .75rem;
            border: 1px solid #dde4e8;
            border-radius: 10px;
            background: #fff;
        }
        
        .item+.item {
            margin-top: .5rem;
        }
        
        .item small {
            color: #6c7a85;
            display: block;
        }
        
        .empty {
            color: #8a97a1;
            font-size: .9rem;
            text-align: center;
            padding: .75rem;
        }
        
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #dde4e8;
            padding: .75rem;
            z-index: 10;
        }
        
        .footer-bar .btn {
            max-width: 496px;
            margin: 0 auto;
            display: block;
            width: 100%;
        }
        
        .form-label {
            font-size: .8rem;
            font-weight: 500;
            margin-bottom: .2rem;
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="app d-flex align-items-center justify-content-between px-3 py-2">
            <h1 class="h5 fw-bold mb-0">Creando registro</h1>
            <a href="#" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </header>

    <main class="app p-3 d-grid gap-3">

        <!-- Ubicación general -->
        <div class="card section-card">
            <div class="card-body">
                <label for="ubicacionGeneral" class="form-label fw-semibold">Ubicación</label>
                <select id="ubicacionGeneral" class="form-select">
      <option>Pyxis GDL</option>
    </select>
            </div>
        </div>

        <!-- Próximos a caducar -->
        <section class="card section-card">
            <div class="card-body">
                <h2 class="h6 section-title mb-3"><i class="bi bi-hourglass-split"></i> Próximos a caducar
                    <span class="badge text-bg-primary ms-auto" id="count-caducar">0</span></h2>
                <form class="form-box row g-2 needs-validation" id="form-caducar" novalidate>
                    <div class="col-6"><label class="form-label">Ubicación</label>
                        <input class="form-control" name="ubicacion" value="A1" required></div>
                    <div class="col-6"><label class="form-label">Fecha de caducidad</label>
                        <input type="date" class="form-control" name="fecha" required></div>
                    <div class="col-8"><label class="form-label">Descripción</label>
                        <input class="form-control" name="descripcion" placeholder="Ej. Omeprazol 20 mg" required></div>
                    <div class="col-4"><label class="form-label">Unidades</label>
                        <input type="number" min="1" class="form-control" name="unidades" required></div>
                    <div class="col-12 d-flex align-items-center gap-3">
                        <span class="form-label mb-0">Vía:</span>
                        <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="vo" name="vo"><label class="form-check-label" for="vo">VO</label></div>
                        <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="iv" name="iv"><label class="form-check-label" for="iv">IV</label></div>
                    </div>
                    <div class="col-12"><button class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Ingresar</button></div>
                </form>
                <div class="mt-3" id="list-caducar"></div>
            </div>
        </section>

        <!-- A retirar -->
        <section class="card section-card">
            <div class="card-body">
                <h2 class="h6 section-title mb-3"><i class="bi bi-box-arrow-up"></i> A retirar
                    <span class="badge text-bg-primary ms-auto" id="count-retirar">0</span></h2>
                <form class="form-box row g-2 needs-validation" id="form-retirar" novalidate>
                    <div class="col-12"><label class="form-label">Medicamento</label>
                        <input class="form-control" name="medicamento" required></div>
                    <div class="col-4"><label class="form-label">Unidades</label>
                        <input type="number" min="1" class="form-control" name="unidades" required></div>
                    <div class="col-8"><label class="form-label">Lote</label>
                        <input class="form-control" name="lote" required></div>
                    <div class="col-6"><label class="form-label">Caducidad</label>
                        <input type="date" class="form-control" name="caducidad" required></div>
                    <div class="col-6"><label class="form-label">Estado</label>
                        <select class="form-select" name="estado" required>
          <option value="">Seleccionar…</option><option>Caducado</option><option>Dañado</option><option>Retiro por lote</option>
        </select></div>
                    <div class="col-12"><label class="form-label">ID</label>
                        <input class="form-control" name="id" required></div>
                    <div class="col-12"><button class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Ingresar</button></div>
                </form>
                <div class="mt-3" id="list-retirar"></div>
            </div>
        </section>

        <!-- Observaciones -->
        <section class="card section-card">
            <div class="card-body">
                <h2 class="h6 section-title mb-3"><i class="bi bi-chat-left-text"></i> Observaciones
                    <span class="badge text-bg-primary ms-auto" id="count-obs">0</span></h2>
                <form class="form-box row g-2 needs-validation" id="form-obs" novalidate>
                    <div class="col-6"><label class="form-label">Ubicación</label>
                        <input class="form-control" name="ubicacion" required></div>
                    <div class="col-6"><label class="form-label">Tipo</label>
                        <select class="form-select" name="tipo" required>
          <option value="">Seleccionar…</option><option>Faltante</option><option>Daño</option><option>Limpieza</option><option>Otro</option>
        </select></div>
                    <div class="col-12"><label class="form-label">Descripción</label>
                        <textarea class="form-control" rows="3" name="descripcion" required></textarea></div>
                    <div class="col-12"><button class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Ingresar</button></div>
                </form>
                <div class="mt-3" id="list-obs"></div>
            </div>
        </section>

        <!-- Deshielo -->
        <div class="card section-card">
            <div class="card-body">
                <label for="deshielo" class="form-label fw-semibold">Deshielo</label>
                <select id="deshielo" class="form-select">
      <option value="">Seleccionar…</option><option>Realizado</option><option>Pendiente</option><option>No aplica</option>
    </select>
            </div>
        </div>
    </main>

    <div class="footer-bar">
        <button class="btn btn-primary btn-lg" id="finalizar"><i class="bi bi-check2-circle"></i> Finalizar registro</button>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="margin-top:3.5rem">
        <div id="toast" class="toast align-items-center text-bg-dark border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toast-msg"></div>
                <button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const data = {
            caducar: [],
            retirar: [],
            obs: []
        };

        // Cada sección: cómo se muestra un elemento en la lista
        const render = {
            caducar: d => [`${d.descripcion} · ${d.unidades} u.`,
                `${d.ubicacion} · Caduca ${d.fecha}${d.vo ? ' · VO' : ''}${d.iv ? ' · IV' : ''}`
            ],
            retirar: d => [`${d.medicamento} · ${d.unidades} u.`,
                `Lote ${d.lote} · ${d.estado} · Cad. ${d.caducidad} · ID ${d.id}`
            ],
            obs: d => [`${d.tipo} en ${d.ubicacion}`, d.descripcion]
        };
        const ids = {
            caducar: 'caducar',
            retirar: 'retirar',
            obs: 'obs'
        };

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
        }

        function paint(key) {
            const box = document.getElementById('list-' + key);
            document.getElementById('count-' + key).textContent = data[key].length;
            if (!data[key].length) {
                box.innerHTML = '<div class="empty">Aún no hay registros</div>';
                return;
            }
            box.innerHTML = data[key].map((d, i) => {
                const [title, sub] = render[key](d);
                return `<div class="item"><div><strong>${esc(title)}</strong><small>${esc(sub)}</small></div>
      <button class="btn btn-sm btn-outline-danger" data-key="${key}" data-i="${i}" aria-label="Eliminar"><i class="bi bi-x-lg"></i></button></div>`;
            }).join('');
        }

        function toast(msg) {
            document.getElementById('toast-msg').textContent = msg;
            bootstrap.Toast.getOrCreateInstance(document.getElementById('toast'), {
                delay: 2200
            }).show();
        }

        // Formularios
        [
            ['form-caducar', 'caducar'],
            ['form-retirar', 'retirar'],
            ['form-obs', 'obs']
        ].forEach(([formId, key]) => {
            const form = document.getElementById(formId);
            const keep = key === 'caducar' ? ['ubicacion'] : []; // conserva la ubicación al seguir capturando
            form.addEventListener('submit', e => {
                e.preventDefault();
                if (!form.checkValidity()) {
                    form.classList.add('was-validated');
                    return;
                }
                const d = Object.fromEntries(new FormData(form));
                if (key === 'caducar') {
                    d.vo = form.vo.checked;
                    d.iv = form.iv.checked;
                }
                data[key].unshift(d);
                const kept = Object.fromEntries(keep.map(k => [k, form[k].value]));
                form.reset();
                form.classList.remove('was-validated');
                keep.forEach(k => form[k].value = kept[k]);
                paint(key);
                toast('Agregado');
            });
        });

        // Eliminar
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-key]');
            if (!b) return;
            data[b.dataset.key].splice(+b.dataset.i, 1);
            paint(b.dataset.key);
        });

        // Finalizar
        document.getElementById('finalizar').addEventListener('click', () => {
            const dsh = document.getElementById('deshielo');
            if (!dsh.value) {
                dsh.classList.add('is-invalid');
                dsh.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
                toast('Selecciona el estado del deshielo');
                return;
            }
            dsh.classList.remove('is-invalid');
            const registro = {
                ubicacion: document.getElementById('ubicacionGeneral').value,
                deshielo: dsh.value,
                ...data
            };
            console.log(registro); // aquí envías al backend: fetch('/api/registros', {method:'POST', body: JSON.stringify(registro)})
            toast('Registro finalizado');
        });

        Object.keys(data).forEach(paint);
    </script>
</body>

</html>
